name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Called by release.yml, so a tag is released only when all of this passes.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go (vet, test, license)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-trixie
        env:
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      BOMCENSUS_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Generated API code is up to date
        run: |
          make generate
          git diff --exit-code -- internal/gen agentproto/dto agentproto/conformance/enums.gen.go server/authz/operations.go \
            deploy/charts/bomcensus-manager/files/detectors.yaml
      - name: gofmt
        run: |
          out=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          [ -z "$out" ] || { echo "::error::not gofmt-ed:"; echo "$out"; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - name: Windows cross-compile
        run: |
          GOOS=windows GOARCH=amd64 go vet ./...
          GOOS=windows GOARCH=arm64 go build ./...
      - name: License headers
        run: go run ./tools/licensehdr .
      - name: Example module (examples/custom-server)
        working-directory: examples/custom-server
        run: |
          go vet ./...
          go test ./...
          GOOS=windows GOARCH=amd64 go build ./...

  # The probe and version command sandbox under privilege scenarios that
  # go test as the runner's user does not reach (scripts/sandbox-matrix.sh):
  # in containers (root with Docker's default capabilities, with the two
  # read capabilities, without capabilities, a non-root user, with
  # CAP_SYS_ADMIN; each with and without Docker's seccomp profile), and on
  # the runner itself through sudo (root, the systemd unit's user and
  # capabilities, root without capabilities, the runner's user, and
  # collect --host-root).
  sandbox:
    name: sandbox matrix (${{ matrix.mode }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        mode: [docker, host]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      # Under /tmp: the scenarios run the binaries as other users.
      SANDBOX_BIN: /tmp/bomcensus-sandbox
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Matrix
        run: make test-sandbox${{ matrix.mode == 'host' && '-host' || '' }}
      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sandbox-logs-${{ matrix.mode }}-${{ matrix.arch }}
          path: /tmp/bomcensus-sandbox/logs
          if-no-files-found: ignore
          retention-days: 7

  windows:
    name: go on windows (build, vet, test)
    runs-on: windows-2025
    steps:
      # Test fixtures must keep LF line endings.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # PostgreSQL-backed tests skip without BOMCENSUS_TEST_DATABASE_URL.
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  console:
    name: console (typecheck, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generated API client is up to date
        run: |
          pnpm run generate:api
          git diff --exit-code -- app/api/gen
      - run: pnpm exec vue-tsc -b --noEmit
      - run: pnpm exec nuxt generate
        env:
          NUXT_TELEMETRY_DISABLED: '1'

  helm:
    name: helm (lint, render)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.18.6
      - run: make helm-lint
