# End-to-end test of the node agent and the in-cluster scanner on a k3d
# cluster (scripts/k8s-e2e.sh). It builds the images, so it runs only when
# the code it covers changes, or by hand.

name: Kubernetes e2e

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/k8s-e2e.yml
      - scripts/k8s-e2e.sh
      - mk/k8s.mk
      - mk/docker.mk
      - mk/helm.mk
      - deploy/docker/**
      - deploy/charts/**
      - go.mod
      - go.sum
      - internal/agent/**
      - internal/collect/**
      - internal/probe/**
      - internal/report/**
      - internal/scanner/**
      - internal/server/ingest/**
      - internal/server/scansvc/**
      - internal/server/vulnsvc/**
      - internal/server/store/postgres/migrations/**
      - internal/server/store/postgres/findings.go
      - internal/server/store/postgres/podlink.go
      - internal/server/store/postgres/inventory_component.go
      - internal/server/store/postgres/inventory_container.go
      - internal/server/store/postgres/inventory_k8s.go
      - internal/server/store/postgres/inventory_process.go
  pull_request:
    paths:
      - .github/workflows/k8s-e2e.yml
      - scripts/k8s-e2e.sh
      - mk/k8s.mk
      - mk/docker.mk
      - mk/helm.mk
      - deploy/docker/**
      - deploy/charts/**
      - go.mod
      - go.sum
      - internal/agent/**
      - internal/collect/**
      - internal/probe/**
      - internal/report/**
      - internal/scanner/**
      - internal/server/ingest/**
      - internal/server/scansvc/**
      - internal/server/vulnsvc/**
      - internal/server/store/postgres/migrations/**
      - internal/server/store/postgres/findings.go
      - internal/server/store/postgres/podlink.go
      - internal/server/store/postgres/inventory_component.go
      - internal/server/store/postgres/inventory_container.go
      - internal/server/store/postgres/inventory_k8s.go
      - internal/server/store/postgres/inventory_process.go
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  K3D_VERSION: v5.8.3

jobs:
  k3d:
    name: node agent and scanner (k3d)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      K8S_E2E_LOGS: /tmp/k8s-e2e-logs
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: azure/setup-helm@v5
        with:
          version: v3.18.6
      - name: Install k3d
        run: |
          curl -fsSL -o /tmp/k3d "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/k3d-linux-amd64"
          sudo install -m 0755 /tmp/k3d /usr/local/bin/k3d
          k3d version
      - name: Test
        run: make test-k8s
      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: k8s-e2e-logs
          path: /tmp/k8s-e2e-logs
          if-no-files-found: ignore
          retention-days: 7
