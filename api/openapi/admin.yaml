openapi: 3.0.3
info:
  title: bomcensus admin API
  version: 1.0.0
  description: |
    API used by the bomcensus console.

    Authentication is a session cookie (`bomcensus_session`, `HttpOnly`,
    `SameSite=Strict`) obtained from `POST /auth/login`.

    Every request other than `GET`, `HEAD` and `OPTIONS` (login included)
    must carry the header `X-Requested-With: bomcensus`, and its `Origin`
    (or `Referer`) host, when sent, must equal the request host. Other
    requests are rejected with `403` and code `forbidden`.

    List endpoints take `q` (free text), endpoint-specific filters, `sort`,
    `limit` (default 200, max 1000) and `offset`, and return
    `{items, total}` where `total` counts all matches before paging.
    A `sort` value is a field name, optionally prefixed with `-` for
    descending order.

    Errors are returned as `{code, message}`. `code` is a stable
    snake_case identifier (for example `not_found`, `invalid_argument`,
    `conflict`); `message` is human-readable English.
  license:
    name: AGPL-3.0-only OR LicenseRef-bomcensus-Commercial
servers:
  - url: /api/v1
security:
  - session: []
tags:
  - name: meta
    description: Server version and features
  - name: auth
    description: Session login and logout
  - name: dashboard
    description: Dashboard counts
  - name: assets
    description: Hosts and workloads
  - name: components
    description: Unique software components
  - name: processes
    description: Processes and listening sockets
  - name: images
    description: Container images aggregated by digest
  - name: kubernetes
    description: Clusters, workloads and pods
  - name: agents
    description: Agents, scanners and listen targets
  - name: enrollment
    description: Register Keys
  - name: updates
    description: Releases and the deployed version
  - name: scans
    description: Agentless scan targets and credentials
  - name: settings
    description: TLS configuration
  - name: feed
    description: Vulnerability feed servers and the instance key

paths:
  /meta:
    get:
      tags: [meta]
      operationId: getMeta
      summary: Server version and enabled features
      responses:
        "200":
          description: Server metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Start a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in. The session cookie is set.
          headers:
            Set-Cookie:
              description: "`bomcensus_session` cookie (`HttpOnly`, `SameSite=Strict`, `Secure` when served over TLS)."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Principal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the current session
      responses:
        "204":
          description: Logged out. The session cookie is cleared.
          headers:
            Set-Cookie:
              description: Expired `bomcensus_session` cookie.
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: The authenticated user
      responses:
        "200":
          description: Current principal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Principal"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /dashboard:
    get:
      tags: [dashboard]
      operationId: getDashboard
      summary: Counts shown on the dashboard
      responses:
        "200":
          description: Dashboard counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /assets:
    get:
      tags: [assets]
      operationId: listAssets
      summary: List assets
      description: "`q` matches name, address, cluster and namespace, OS name and version, tags and container image references."
      parameters:
        - $ref: "#/components/parameters/QueryQ"
        - name: kind
          in: query
          schema:
            $ref: "#/components/schemas/AssetKind"
        - name: group
          in: query
          schema:
            type: string
        - name: tag
          in: query
          schema:
            type: string
        - name: method
          in: query
          schema:
            $ref: "#/components/schemas/CollectMethod"
        - name: coverage
          in: query
          description: "A coverage value, or `limited` for every coverage other than `full`."
          schema:
            type: string
            enum: [limited, full, partial, process_only, inventory_only, unsupported, failed]
        - name: clusterId
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, "-name", kind, "-kind", os, "-os", group, "-group", method, "-method", coverage, "-coverage", firstSeen, "-firstSeen", lastSeen, "-lastSeen"]
            default: name
        - $ref: "#/components/parameters/QueryLimit"
        - $ref: "#/components/parameters/QueryOffset"
      responses:
        "200":
          description: Assets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /asset-groups:
    get:
      tags: [assets]
      operationId: listAssetGroups
      summary: List asset groups in use
      parameters:
        - $ref: "#/components/parameters/QueryQ"
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, "-name", assetCount, "-assetCount"]
            default: name
        - $ref: "#/components/parameters/QueryLimit"
        - $ref: "#/components/parameters/QueryOffset"
      responses:
        "200":
          description: Groups
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetGroupList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /assets/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [assets]
      operationId: getAsset
      summary: Get an asset
      responses:
        "200":
          description: Asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /assets/{id}/components:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [assets]
      operationId: listAssetComponents
      summary: Components installed on an asset
      description: "`q` matches component name, version, purl, container name and locations."
      parameters:
        - $ref: "#/components/parameters/QueryQ"
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/ComponentType"
        - name: origin
          in: query
          schema:
            $ref: "#/components/schemas/ComponentOrigin"
        - name: container
          in: query
          description: Only components found in this container. Cannot be combined with `hostOnly`.
          schema:
            type: string
        - name: hostOnly
          in: query
          description: Only components found outside containers.
          schema:
            type: boolean
        - name: layer
          in: query
          schema:
            $ref: "#/components/schemas/ComponentLayer"
        - name: inUse
          in: query
          schema:
            type: boolean
        - name: includeRemoved
          in: query
          description: Also return components that were removed (with `removedAt` set).
          schema:
            type: boolean
            default: false
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, "-name", version, "-version", type, "-type", origin, "-origin", method, "-method", container, "-container", inUse, "-inUse", firstSeen, "-firstSeen"]
            default: name
        - $ref: "#/components/parameters/QueryLimit"
        - $ref: "#/components/parameters/QueryOffset"
      responses:
        "200":
          description: Components of the asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetComponentList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /assets/{id}/processes:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [assets]
      operationId: listAssetProcesses
      summary: Processes of an asset
      description: "`q` matches executable path, user, command line and pid."
      parameters:
        - $ref: "#/components/parameters/QueryQ"
        - name: view
          in: query
          schema:
            type: string
            enum: [all, restart, suspicious, listen]
            default: all
        - name: container
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum: [pid, "-pid", user, "-user", exe, "-exe", state, "-state", startedAt, "-startedAt"]
            default: pid
        - $ref: "#/components/parameters/QueryLimit"
        - $ref: "#/components/parameters/QueryOffset"
      responses:
        "200":
          description: Processes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /assets/{id}/instances:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [assets]
      operationId: listAssetInstances
      summary: Instances (pods) of a workload asset
      description: A host asset has no separate instances and returns an empty list.
      parameters:
        - $ref: "#/components/parameters/QueryQ"
        - name: phase
          in: query
          schema:
            $ref: "#/components/schemas/K8sPodPhase"
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, "-name", node, "-node", phase, "-phase", startedAt, "-startedAt"]
            default: name
        - $ref: "#/components/parameters/QueryLimit"
        - $ref: "#/components/parameters/QueryOffset"
      responses:
        "200":
          description: Pods
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/K8sPodList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /assets/{id}/collect:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [assets]
      operationId: collectAsset
      summary: Request a collection now
      description: |
        Sends a `collect` directive to the asset's agent, runs its scan target,
        or schedules an exec collection for a workload. Returns `409` when the
        asset has no way to be collected (for example a revoked agent).
      responses:
        "202":
          description: Collection requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /components:
    get:
      tags: [components]
      operationId: listComponents
      summary: List unique components
      description: "`q` matches name and purl."
      parameters:
        - $ref: "#/components/parameters/QueryQ"
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/ComponentType"
        - name: origin
          in: query
          schema:
            $ref: "#/components/schemas/ComponentOrigin"
        - name: installed
          in: query
          description: Only components installed on at least one asset now (`assetCount` > 0).
          schema:
            type: boolean
            default: false
        - name: running
          in: query
          description: Only components a running process uses now (`runningAssetCount` > 0).
          schema:
            type: boolean
            default: false
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, "-name", version, "-version", type, "-type", origin, "-origin", assetCount, "-assetCount", runningAssetCount, "-runningAssetCount", purl, "-purl"]
            default: name
        - $ref: "#/components/parameters/QueryLimit"
        - $ref: "#/components/parameters/QueryOffset"
      responses:
        "200":
          description: Components
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /components/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [components]
      operationId: getComponent
      summary: Get a component
      responses:
        "200":
          description: Component
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /components/{id}/assets:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [components]
      operationId: listComponentAssets
      summary: Assets on which a component is installed
      description: "`q` matches asset name, container name and locations."
      parameters:
        - $ref: "#/components/parameters/QueryQ"
        - name: inUse
          in: query
          schema:
            type: boolean
        - name: method
          in: query
          schema:
            $ref: "#/components/schemas/DetectMethod"
        - name: includeRemoved
          in: query
          schema:
            type: boolean
            default: false
        - name: sort
          in: query
          schema:
            type: string
            enum: [asset, "-asset", method, "-method", inUse, "-inUse", firstSeen, "-firstSeen"]
            default: asset
        - $ref: "#/components/parameters/QueryLimit"
        - $ref: "#/components/parameters/QueryOffset"
      responses:
        "200":
          description: Installations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentAssetList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /components/{id}/vulnerabilities:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [components]
      operationId: listComponentVulnerabilities
      summary: Vulnerabilities the active feed server matched to a component
      description: |
        `match` is absent while the component has not been matched. An empty
        `items` with `match.status` `checked` means no known vulnerability;
        `unsupported` means the feed server has no data for it.
      responses:
        "200":
          description: Vulnerabilities, known exploited first, then by score
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentVulnerabilities"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /processes:
    get:
      tags: [processes]
      operationId: listProcesses
      summary: Processes across all assets
      description: |
        `view=restart`: the executable or a mapped library was replaced on disk
        (an old version is still in memory). `view=suspicious`: the executable
        or a mapped library was deleted, or the process runs from a memfd.
        `q` matches executable path, user and command line.
      parameters:
        - $ref: "#/components/parameters/QueryQ"
        - name: view
          in: query
          schema:
            type: string
            enum: [all, restart, suspicious]
            default: all
        - name: assetId
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            $ref: "#/components/schemas/ExeState"
        - name: sort
          in: query
          schema:
            type: string
            enum: [asset, "-asset", exe, "-exe", user, "-user", state, "-state", startedAt, "-startedAt"]
            default: asset
        - $ref: "#/components/parameters/QueryLimit"
        - $ref: "#/components/parameters/QueryOffset"
      responses:
        "200":
          description: Processes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /listen-ports:
    get:
      tags: [processes]
      operationId: listListenPorts
      summary: Listening sockets across all assets
      description: Includes sockets whose owning process could not be determined (no `processId`).
      parameters:
        - $ref: "#/components/parameters/QueryQ"
        - name: assetId
          in: query
          schema:
            type: string
        - name: proto
          in: query
          schema:
            $ref: "#/components/schemas/ListenProto"
        - name: port
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 65535
        - name: sort
          in: query
          schema:
            type: string
            enum: [port, "-port", address, "-address", process, "-process", user, "-user", asset, "-asset"]
            default: port
        - $ref: "#/components/parameters/QueryLimit"
        - $ref: "#/components/parameters/QueryOffset"
      responses:
        "200":
          description: Listening sockets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListenPortList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /images:
    get:
      tags: [images]
      operationId: listImages
      summary: Container images, aggregated by digest
      description: "`q` matches digest and current and previous tags. Sort `tag` uses the first current tag, else the most recently seen previous tag."
      parameters:
        - $ref: "#/components/parameters/QueryQ"
        - name: inUse
          in: query
          description: Only images used by at least one container.
          schema:
            type: boolean
        - name: contentKnown
          in: query
          schema:
            type: boolean
        - name: sort
          in: query
          schema:
            type: string
            enum: [tag, "-tag", digest, "-digest", os, "-os", arch, "-arch", size, "-size", instances, "-instances", firstSeen, "-firstSeen"]
            default: tag
        - $ref: "#/components/parameters/QueryLimit"
        - $ref: "#/components/parameters/QueryOffset"
      responses:
        "200":
          description: Images
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContainerImageList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /images/{digest}:
    parameters:
      - $ref: "#/components/parameters/PathDigest"
    get:
      tags: [images]
      operationId: getImage
      summary: Get an image with the containers that use it and its components
      responses:
        "200":
          description: Image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContainerImageDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /k8s/clusters:
    get:
      tags: [kubernetes]
      operationId: listK8sClusters
      summary: List Kubernetes clusters
      parameters:
        - $ref: "#/components/parameters/QueryQ"
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, "-name", version, "-version", connection, "-connection", execEnabled, "-execEnabled", workloadCount, "-workloadCount", lastSync, "-lastSync"]
            default: name
        - $ref: "#/components/parameters/QueryLimit"
        - $ref: "#/components/parameters/QueryOffset"
      responses:
        "200":
          description: Clusters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/K8sClusterList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/UnexpectedError"
    post:
      tags: [kubernetes]
      operationId: createK8sCluster
      summary: Register a Kubernetes cluster
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/K8sClusterCreate"
      responses:
        "201":
          description: Cluster created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/K8sCluster"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /k8s/clusters/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [kubernetes]
      operationId: getK8sCluster
      summary: Get a Kubernetes cluster
      responses:
        "200":
          description: Cluster
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/K8sCluster"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"
    patch:
      tags: [kubernetes]
      operationId: updateK8sCluster
      summary: Change a Kubernetes cluster
      description: Absent fields are left unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/K8sClusterUpdate"
      responses:
        "200":
          description: Cluster updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/K8sCluster"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/UnexpectedError"
    delete:
      tags: [kubernetes]
      operationId: deleteK8sCluster
      summary: Remove a Kubernetes cluster and its workload assets
      responses:
        "204":
          description: Cluster deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /k8s/clusters/{id}/workloads:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [kubernetes]
      operationId: listK8sWorkloads
      summary: Workloads of a cluster
      description: "`q` matches name, namespace and kind. Workloads excluded by the filter are included with `excluded: true`."
      parameters:
        - $ref: "#/components/parameters/QueryQ"
        - name: namespace
          in: query
          schema:
            type: string
        - name: kind
          in: query
          schema:
            type: string
        - name: excluded
          in: query
          schema:
            type: boolean
        - name: sort
          in: query
          schema:
            type: string
            enum: [namespace, "-namespace", kind, "-kind", name, "-name", replicas, "-replicas"]
            default: namespace
        - $ref: "#/components/parameters/QueryLimit"
        - $ref: "#/components/parameters/QueryOffset"
      responses:
        "200":
          description: Workloads
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/K8sWorkloadList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /k8s/workloads/{id}/pods:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [kubernetes]
      operationId: listK8sWorkloadPods
      summary: Pods of a workload
      parameters:
        - $ref: "#/components/parameters/QueryQ"
        - name: phase
          in: query
          schema:
            $ref: "#/components/schemas/K8sPodPhase"
        - name: sort
