    PreviousImageTags:
      description: |
        Tags that pointed to the digest before and are not current, most
        recently seen first.
      type: array
      items:
        $ref: "#/components/schemas/PreviousImageTag"
    ContainerImage:
      description: |
        An image is not an asset. It aggregates the containers of all assets
        by image digest. An image that no container uses any more stays in the
        list with zero usage until it has not been seen for the retention
        period of gone inventory (30 days).
      type: object
      required: [digest, currentTags, previousTags, firstSeen, usage, contentKnown, componentCount]
      properties:
        digest:
          type: string
        currentTags:
          $ref: "#/components/schemas/CurrentImageTags"
        previousTags:
