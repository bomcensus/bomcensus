      enum: [pinned, system, none]
    UpdateState:
      type: string
      enum: [up_to_date, pending, updating, rolled_back]
    Agent:
      type: object
      required: [id, kind, hostname, version, os, arch, status, connMode, tlsMode, privilege, execHelper, registerKeyId, address, trustBundleSynced, updateState, enrolledAt, lastSeen]
      properties:
        id:
          type: string
        kind:
          $ref: "#/components/schemas/AgentKind"
        hostname:
          type: string
        description:
          description: Set by an administrator to tell agents apart. Absent when none.
          type: string
        assetId:
          description: The host asset of an agent. Absent for scanners and pending agents.
          type: string
        version:
          type: string
        os:
          type: string
        arch:
          type: string
        status:
          $ref: "#/components/schemas/AgentStatus"
        connMode:
          $ref: "#/components/schemas/ConnMode"
        listenAddress:
          description: Address the server dials (`connMode=listen`).
          type: string
        listenTargetId:
          type: string
        tlsMode:
          $ref: "#/components/schemas/TlsMode"
        tlsInterceptedBy:
          description: Issuer of the server certificate the agent observed, when it is not the server's own certificate (TLS terminated in transit).
          type: string
        privilege:
          $ref: "#/components/schemas/PrivilegeLevel"
        execHelper:
          type: boolean
        registerKeyId:
          type: string
        address:
          description: Peer address of the last connection.
          type: string
        certExpiresAt:
          description: Absent until a certificate is issued.
          type: string
          format: date-time
        trustBundleSynced:
          description: The agent holds the current trust bundle.
          type: boolean
        updateState:
          $ref: "#/components/schemas/UpdateState"
        updateMessage:
          description: Detail of the last update attempt, for example why it was rolled back.
          type: string
        enrolledAt:
          type: string
          format: date-time
        lastSeen:
          type: string
          format: date-time
    AgentUpdate:
      type: object
      properties:
        description:
          type: string
          maxLength: 200
    AgentList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Agent"
        total:
          type: integer

    ListenTargetState:
      type: string
      enum: [connecting, connected, disconnected, failed]
    ListenTarget:
      type: object
      required: [id, address, state, createdAt]
      properties:
        id:
          type: string
        address:
          description: "`host:port` the server dials."
          type: string
        registerKeyId:
          description: When set, only this Register Key may enroll an agent over this target.
          type: string
        agentId:
          description: Agent bound to the address after enrollment.
          type: string
        state:
          $ref: "#/components/schemas/ListenTargetState"
        lastError:
          type: string
        lastConnectedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    ListenTargetCreate:
      type: object
      required: [address]
      properties:
        address:
          type: string
          minLength: 1
          maxLength: 512
        registerKeyId:
          type: string
    ListenTargetUpdate:
      type: object
      properties:
        address:
          type: string
          minLength: 1
          maxLength: 512
        registerKeyId:
          type: string
          nullable: true
          x-go-type: nullable.Nullable[string]
          x-go-type-skip-optional-pointer: true
          x-go-type-import:
            path: github.com/oapi-codegen/nullable
    ListenTargetList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ListenTarget"
        total:
          type: integer

    # ── enrollment ──────────────────────────────────────────────────────

    RegisterKeyApproval:
      type: string
      enum: [auto, manual]
    RegisterKeyState:
      type: string
      enum: [valid, expired, revoked, exhausted]
    RegisterKey:
      type: object
      required: [id, name, target, allowedCidrs, maxUses, usedCount, approval, allowRelaxedTls, defaultGroup, defaultTags, state, createdAt]
      properties:
        id:
          description: The key id (11 characters, unpadded base64url). Not secret.
          type: string
        name:
          type: string
        target:
          $ref: "#/components/schemas/AgentKind"
        expiresAt:
          type: string
          format: date-time
        allowedCidrs:
          description: Empty means any source address.
          type: array
          items:
            type: string
        maxUses:
          description: 0 means unlimited.
          type: integer
        usedCount:
          type: integer
        approval:
          $ref: "#/components/schemas/RegisterKeyApproval"
        allowRelaxedTls:
          type: boolean
        defaultGroup:
          type: string
        defaultTags:
          type: array
          items:
            type: string
        state:
          $ref: "#/components/schemas/RegisterKeyState"
        createdAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
    RegisterKeyCreate:
      type: object
      required: [name, target, approval]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        target:
          $ref: "#/components/schemas/AgentKind"
        expiresAt:
          type: string
          format: date-time
        allowedCidrs:
          type: array
          items:
            type: string
        maxUses:
          type: integer
          minimum: 0
          default: 0
        approval:
          $ref: "#/components/schemas/RegisterKeyApproval"
        allowRelaxedTls:
          type: boolean
          default: false
        defaultGroup:
          type: string
        defaultTags:
          type: array
          items:
            type: string
    RegisterKeyCreated:
      type: object
      required: [key, enrollment]
      properties:
        key:
          $ref: "#/components/schemas/RegisterKey"
        enrollment:
          description: "`bc1.<ca-hash>.<key-id>.<secret>`. Shown once; the server does not keep the secret."
          type: string
          pattern: "^bc1\\.[A-Za-z0-9_-]{43}\\.[A-Za-z0-9_-]{11}\\.[A-Za-z0-9_-]{43}$"
    RegisterKeyList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RegisterKey"
        total:
          type: integer

    # ── updates ─────────────────────────────────────────────────────────

    ReleaseSource:
      type: string
      enum: [online, upload]
    Release:
      type: object
      required: [version, publishedAt, importedAt, source, verified, notes, platforms]
      properties:
        version:
          type: string
        publishedAt:
          description: Issue time from the signed manifest.
          type: string
          format: date-time
        importedAt:
          type: string
          format: date-time
        source:
          $ref: "#/components/schemas/ReleaseSource"
        verified:
          description: Manifest signature and code signatures verified.
          type: boolean
        notes:
          type: string
        platforms:
          description: "`<os>-<arch>` entries in the bundle, for example `linux-amd64`."
          type: array
          items:
            type: string
    ReleaseList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Release"
        total:
          type: integer
    ReleaseUpload:
      type: object
      required: [bundle]
      properties:
        bundle:
          description: Release bundle `bomcensus-<version>.tar`.
          type: string
          format: binary
    UpdateSettings:
      description: The deployed version is one for the whole server. Agents ask every `checkIntervalMinutes` and update when their version differs; they never downgrade.
      type: object
      required: [targetVersion, checkIntervalMinutes]
      properties:
        targetVersion:
          type: string
          nullable: true
        checkIntervalMinutes:
          type: integer
          minimum: 1
          maximum: 10080

    # ── scans ───────────────────────────────────────────────────────────

    ScanProtocol:
      type: string
      enum: [ssh]
    ScanResult:
      type: string
      enum: [ok, partial, failed]
    ScanRun:
      type: object
      required: [at, result, durationSec]
      properties:
        at:
          type: string
          format: date-time
        result:
          $ref: "#/components/schemas/ScanResult"
        message:
          type: string
        durationSec:
          type: integer
    ScanTarget:
      type: object
      required: [id, name, protocol, address, port, credentialId, sudo, hostKeyPinned, intervalMinutes, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        protocol:
          $ref: "#/components/schemas/ScanProtocol"
        address:
          type: string
        port:
          type: integer
        credentialId:
          type: string
        scannerId:
          description: Absent means the server's embedded scanner.
          type: string
        sudo:
          type: boolean
        hostKeyPinned:
          description: A host key is pinned (given at creation, or recorded on first connection).
          type: boolean
        hostKeyFingerprint:
          description: "Pinned host key, `SHA256:<base64>`."
          type: string
        intervalMinutes:
          description: Minutes between scheduled scans. 0 means on demand only.
          type: integer
          minimum: 0
        assetId:
          type: string
        lastRun:
          $ref: "#/components/schemas/ScanRun"
        createdAt:
          type: string
          format: date-time
    ScanTargetCreate:
      description: |
        Without `hostKey` the first host key seen is pinned. The server stores
        host keys, not fingerprints, so `hostKeyFingerprint` is rejected with
        `400`; give the key itself in `hostKey`.
      type: object
      required: [name, address, credentialId]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        protocol:
          $ref: "#/components/schemas/ScanProtocol"
        address:
          type: string
          minLength: 1
          maxLength: 512
        port:
          type: integer
          minimum: 1
          maximum: 65535
          default: 22
        credentialId:
          type: string
        scannerId:
          type: string
        sudo:
          type: boolean
          default: false
        hostKeyFingerprint:
          type: string
        hostKey:
          description: "Host public key to pin, in `known_hosts` / `authorized_keys` form: `<type> <base64>` (for example `ssh-ed25519 AAAA…`)."
          type: string
          maxLength: 16384
        intervalMinutes:
          description: Minutes between scheduled scans. 0 means on demand only.
          type: integer
          minimum: 0
          default: 0
    ScanTargetUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        port:
          type: integer
          minimum: 1
          maximum: 65535
        credentialId:
          type: string
        scannerId:
          type: string
          nullable: true
          x-go-type: nullable.Nullable[string]
          x-go-type-skip-optional-pointer: true
          x-go-type-import:
            path: github.com/oapi-codegen/nullable
        sudo:
          type: boolean
        intervalMinutes:
          type: integer
          minimum: 0
        resetHostKey:
          type: boolean
          default: false
    ScanTargetList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ScanTarget"
        total:
          type: integer

    CredentialKind:
      type: string
      enum: [ssh_key, ssh_password, kubeconfig]
    Credential:
      type: object
      required: [id, name, kind, usedBy, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          $ref: "#/components/schemas/CredentialKind"
        username:
          description: SSH kinds only.
          type: string
        publicKeyFingerprint:
          description: "`ssh_key` only. `SHA256:<base64>` of the public key."
          type: string
        usedBy:
          description: Scan targets and clusters that use the credential.
          type: integer
        createdAt:
          type: string
          format: date-time
    CredentialCreate:
      description: |
        Secrets are encrypted at rest and never returned.
        `ssh_key`: `username`, `privateKey` (OpenSSH or PEM), optional
        `passphrase`. `ssh_password`: `username`, `password`.
        `kubeconfig`: `kubeconfig` (YAML).
      type: object
      required: [name, kind]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        kind:
          $ref: "#/components/schemas/CredentialKind"
        username:
          type: string
        privateKey:
          type: string
          writeOnly: true
        passphrase:
          type: string
          format: password
          writeOnly: true
        password:
          type: string
          format: password
          writeOnly: true
        kubeconfig:
          type: string
          writeOnly: true
    CredentialSecretUpdate:
      description: Fields as in `CredentialCreate` for the credential's kind.
      type: object
      properties:
        username:
          type: string
        privateKey:
          type: string
          writeOnly: true
        passphrase:
          type: string
          format: password
          writeOnly: true
        password:
          type: string
          format: password
          writeOnly: true
        kubeconfig:
          type: string
          writeOnly: true
    CredentialList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Credential"
        total:
          type: integer

    # ── settings ────────────────────────────────────────────────────────

    TlsEndpointName:
      type: string
      enum: [web, agent]
    TlsCertMode:
      description: |
        `auto`: issued and renewed by an internal CA. `manual`: chain and key
        supplied by the administrator. `off` (reported for `web` only, never
        accepted in an update): the server does not terminate Web/API TLS
        because `BOMCENSUS_WEB_TLS=off`; subject, issuer and names are empty
        and `expiresAt` is absent.
      type: string
      enum: [auto, manual, "off"]
    TlsEndpoint:
      type: object
      required: [mode, subject, issuer, names]
      properties:
        mode:
          $ref: "#/components/schemas/TlsCertMode"
        subject:
          type: string
        issuer:
          type: string
        names:
          description: Subject alternative names.
          type: array
          items:
            type: string
        expiresAt:
          type: string
          format: date-time
        clientSubject:
          description: "`agent` only: subject of the client certificate the server presents to listen-mode agents, when it is not the server certificate."
          type: string
        clientExpiresAt:
          description: "`agent` only: expiry of that client certificate."
          type: string
          format: date-time
    PendingAnchor:
      type: object
      required: [spkiHash, subject, expiresAt, preparedAt, unsyncedAgents]
      properties:
        spkiHash:
          description: Unpadded base64url SHA-256 of the new anchor's SPKI.
          type: string
        subject:
          type: string
        expiresAt:
          type: string
          format: date-time
        preparedAt:
          type: string
          format: date-time
        unsyncedAgents:
          description: Non-revoked agents that have not picked up the bundle containing this anchor.
          type: integer
    TlsState:
      type: object
      required: [web, agent, anchorSpkiHash, agentCaExpiresAt, unsyncedAgents]
      properties:
        web:
          $ref: "#/components/schemas/TlsEndpoint"
        agent:
          $ref: "#/components/schemas/TlsEndpoint"
        anchorSpkiHash:
          description: Unpadded base64url SHA-256 of the Agent TLS trust anchor's SPKI (the `ca-hash` of enrollment strings).
          type: string
        agentCaExpiresAt:
          description: Expiry of the Agent CA that issues agent certificates.
          type: string
          format: date-time
        unsyncedAgents:
          description: Non-revoked agents that do not hold the current trust bundle.
          type: integer
        pendingAnchor:
          $ref: "#/components/schemas/PendingAnchor"
    TlsEndpointUpdate:
      type: object
      required: [mode]
      properties:
        mode:
          $ref: "#/components/schemas/TlsCertMode"
        certificateChain:
          description: PEM certificates, leaf first. Required for `manual`.
          type: string
        privateKey:
          description: PEM private key of the leaf. Required for `manual`.
          type: string
          writeOnly: true
        clientCertificateChain:
          description: |
            `agent` with `manual` only: PEM certificates, leaf first, of the
            client-authentication certificate the server presents to
            listen-mode agents. It must chain to the same trust anchor as
            `certificateChain`. When absent, the `certificateChain` leaf is
            used and must allow both server and client authentication.
          type: string
        clientPrivateKey:
          description: PEM private key of the `clientCertificateChain` leaf.
          type: string
          writeOnly: true
    AgentAnchorChange:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [prepare, activate, cancel]
        certificate:
          description: "`prepare` in manual mode: PEM certificate of the new anchor."
          type: string
        force:
          description: "`activate` even though some agents have not synchronized."
          type: boolean
          default: false

    # ── feed ────────────────────────────────────────────────────────────

    FeedInstance:
      type: object
      required: [instanceId, createdAt]
      properties:
        instanceId:
          description: Public key, `x25519 <base64>`.
          type: string
          example: x25519 35i1AJE2RhGaEaNDtsBJZlCtYi9bgQngHhcBvJ8NJEQ=
        createdAt:
          type: string
          format: date-time
    FeedServerStatus:
      description: |
        `never`: not contacted yet (or a new key was just trusted).
        `connected`: the last contact succeeded. `key_changed`: the server
        presented another key than the stored one and is not used.
        `error`: the last contact failed (`lastError`).
      type: string
      enum: [never, connected, key_changed, error]
    FeedSource:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: osv/Debian
        updatedAt:
          description: Last successful collection.
          type: string
          format: date-time
        changedAt:
          description: Last collection that changed data.
          type: string
          format: date-time
        healthy:
          description: False when the last collection failed.
          type: boolean
    FeedServer:
      type: object
      required: [id, name, url, builtin, active, enabled, telemetry, status, sources, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        url:
          type: string
        builtin:
          description: The default server; it cannot be removed.
          type: boolean
        active:
          description: Components are matched against this server.
          type: boolean
        enabled:
          type: boolean
        telemetry:
          description: Allow the server to count this installation's queries in its anonymous daily statistics.
          type: boolean
        serverKey:
          description: Trusted server key, absent before the first contact.
          type: string
        keyTrustedAt:
          type: string
          format: date-time
        presentedKey:
          description: Key the server presented in the `key_changed` state.
          type: string
        presentedAt:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/FeedServerStatus"
        lastError:
          type: string
        lastErrorAt:
          type: string
          format: date-time
        lastOkAt:
          type: string
          format: date-time
        grade:
          description: The server's grade of this instance, e.g. `anonymous`.
          type: string
        sessionExpiresAt:
          type: string
          format: date-time
        revision:
          description: Data revision at the last status check.
          type: integer
          format: int64
        rulesDigest:
          description: Matching rules digest at the last status check.
          type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/FeedSource"
        statusCheckedAt:
          type: string
          format: date-time
        matching:
          $ref: "#/components/schemas/FeedMatchCounts"
        createdAt:
          type: string
          format: date-time
    FeedMatchCounts:
      description: |
        Active server only, after the first status check: live components by
        match state against the current data revision and rules.
      type: object
      required: [checked, unsupported, invalid, pending, vulnerable]
      properties:
        checked:
          type: integer
        unsupported:
          description: The feed server has no data for these; they are not known to be safe.
          type: integer
        invalid:
          type: integer
        pending:
          type: integer
        vulnerable:
          description: Checked components with at least one vulnerability.
          type: integer
    FeedServerList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FeedServer"
        total:
          type: integer
    FeedServerCreate:
      type: object
      required: [name, url]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        url:
          type: string
          minLength: 1
          maxLength: 512
          example: https://feed.corp.example
        telemetry:
          type: boolean
          default: true
    FeedServerUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        enabled:
          type: boolean
        telemetry:
          type: boolean
        active:
          description: Only `true` is accepted; activating another server deactivates this one.
          type: boolean
    FeedServerTrustKey:
      type: object
      required: [key]
      properties:
        key:
          description: The presented key, `x25519 <base64>`.
          type: string

    # ── vulnerabilities ─────────────────────────────────────────────────

    Severity:
      description: CVSS rating of the highest base score.
      type: string
      enum: [critical, high, medium, low, none]
    FixState:
      type: string
      enum: [fixed, not_fixed, will_not_fix, under_investigation, unknown]
    VulnAdvisory:
      type: object
      required: [source, id]
      properties:
        source:
          type: string
          example: osv
        id:
          type: string
          example: DEBIAN-CVE-2024-6387
        severity:
          description: The distribution's rating, when it has one.
          type: string
    ComponentMatchState:
      type: object
      required: [status, matchedAt, revision]
      properties:
        status:
          type: string
          enum: [checked, unsupported, invalid]
        reason:
          type: string
        osKey:
          description: The release OS packages were matched against.
          type: string
          example: ubuntu:24.04
        revision:
          type: integer
          format: int64
        matchedAt:
          type: string
          format: date-time
    ComponentVulnerability:
      type: object
      required: [vulnId, method, fixState, aliases, platforms, advisories, kev]
      properties:
        vulnId:
          type: string
          example: CVE-2024-6387
        aliases:
          type: array
          items:
            type: string
        summary:
          type: string
        severity:
          $ref: "#/components/schemas/Severity"
        score:
          description: Highest CVSS base score.
          type: number
          format: double
        kev:
          description: Listed in the CISA Known Exploited Vulnerabilities catalog.
          type: boolean
        kevAdded:
          type: string
          format: date
        epss:
          type: number
          format: double
        epssPercentile:
          type: number
          format: double
        published:
          type: string
          format: date-time
        method:
          description: "`package`: an advisory of the package's ecosystem. `cpe`: a CPE configuration (NVD, VulnCheck or the CNA)."
          type: string
          enum: [package, cpe]
        ecosystem:
          type: string
        fixState:
          $ref: "#/components/schemas/FixState"
        fixedVersion:
          type: string
        cpeMatch:
          type: string
          enum: [exact, range]
        rangeSource:
          type: string
          enum: [nvd, vulncheck, cna]
        platforms:
          description: The match holds only together with one of these CPEs, which were not checked.
          type: array
          items:
            type: string
        advisories:
          type: array
          items:
            $ref: "#/components/schemas/VulnAdvisory"
    ComponentVulnerabilities:
      type: object
      required: [items]
      properties:
        match:
          $ref: "#/components/schemas/ComponentMatchState"
        items:
          type: array
          items:
            $ref: "#/components/schemas/ComponentVulnerability"
