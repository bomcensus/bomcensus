        - $ref: "#/components/parameters/QueryLimit"
        - $ref: "#/components/parameters/QueryOffset"
      responses:
        "200":
          description: Pods
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/K8sPodList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /k8s/clusters/{id}/sync:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [kubernetes]
      operationId: syncK8sCluster
      summary: Request an inventory sync (and exec collection when enabled) now
      responses:
        "202":
          description: Sync requested
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /agents:
    get:
      tags: [agents]
      operationId: listAgents
      summary: List agents and scanners
      description: "`q` matches hostname, description, address, id, OS and listen address."
      parameters:
        - $ref: "#/components/parameters/QueryQ"
        - name: kind
          in: query
          schema:
            $ref: "#/components/schemas/AgentKind"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/AgentStatus"
        - name: connMode
          in: query
          schema:
            $ref: "#/components/schemas/ConnMode"
        - name: tlsMode
          in: query
          schema:
            $ref: "#/components/schemas/TlsMode"
        - name: updateState
          in: query
          schema:
            $ref: "#/components/schemas/UpdateState"
        - name: registerKeyId
          in: query
          schema:
            type: string
        - name: version
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum: [hostname, "-hostname", status, "-status", version, "-version", connMode, "-connMode", tlsMode, "-tlsMode", privilege, "-privilege", address, "-address", enrolledAt, "-enrolledAt", lastSeen, "-lastSeen"]
            default: hostname
        - $ref: "#/components/parameters/QueryLimit"
        - $ref: "#/components/parameters/QueryOffset"
      responses:
        "200":
          description: Agents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /agents/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [agents]
      operationId: getAgent
      summary: Get an agent or scanner
      responses:
        "200":
          description: Agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"
    patch:
      tags: [agents]
      operationId: updateAgent
      summary: Change the administrator-set fields of an agent or scanner
      description: Absent fields are left unchanged; an empty `description` removes it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentUpdate"
      responses:
        "200":
          description: Agent updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /agents/{id}/approve:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [agents]
      operationId: approveAgent
      summary: Approve a pending enrollment
      description: Returns `409` unless the agent is `pending_approval`.
      responses:
        "200":
          description: Agent approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /agents/{id}/revoke:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [agents]
      operationId: revokeAgent
      summary: Revoke an agent (blocks its certificate and identity key)
      description: Also rejects a pending enrollment. Returns `409` when already revoked.
      responses:
        "200":
          description: Agent revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /listen-targets:
    get:
      tags: [agents]
      operationId: listListenTargets
      summary: Addresses of listen-mode agents the server dials
      description: "`q` matches address and bound agent hostname."
      parameters:
        - $ref: "#/components/parameters/QueryQ"
        - name: state
          in: query
          schema:
            $ref: "#/components/schemas/ListenTargetState"
        - name: sort
          in: query
          schema:
            type: string
            enum: [address, "-address", state, "-state", createdAt, "-createdAt", lastConnectedAt, "-lastConnectedAt"]
            default: address
        - $ref: "#/components/parameters/QueryLimit"
        - $ref: "#/components/parameters/QueryOffset"
      responses:
        "200":
          description: Listen targets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListenTargetList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/UnexpectedError"
    post:
      tags: [agents]
      operationId: createListenTarget
      summary: Add an address for the server to dial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListenTargetCreate"
      responses:
        "201":
          description: Listen target created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListenTarget"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /listen-targets/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    patch:
      tags: [agents]
      operationId: updateListenTarget
      summary: Change a listen target
      description: |
        Absent fields are left unchanged; `registerKeyId: null` removes the
        key restriction. A changed address resets the state to `connecting`;
        the bound agent is kept.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListenTargetUpdate"
      responses:
        "200":
          description: Listen target updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListenTarget"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/UnexpectedError"
    delete:
      tags: [agents]
      operationId: deleteListenTarget
      summary: Stop dialing an address
      description: The bound agent is not revoked; it stays offline until a target with its address is added again.
      responses:
        "204":
          description: Listen target deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /register-keys:
    get:
      tags: [enrollment]
      operationId: listRegisterKeys
      summary: List Register Keys
      description: Never returns secrets or enrollment strings. `q` matches name and key id.
      parameters:
        - $ref: "#/components/parameters/QueryQ"
        - name: target
          in: query
          schema:
            $ref: "#/components/schemas/AgentKind"
        - name: state
          in: query
          schema:
            $ref: "#/components/schemas/RegisterKeyState"
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, "-name", target, "-target", state, "-state", expiresAt, "-expiresAt", usedCount, "-usedCount", approval, "-approval", createdAt, "-createdAt"]
            default: "-createdAt"
        - $ref: "#/components/parameters/QueryLimit"
        - $ref: "#/components/parameters/QueryOffset"
      responses:
        "200":
          description: Register Keys
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterKeyList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/UnexpectedError"
    post:
      tags: [enrollment]
      operationId: createRegisterKey
      summary: Create a Register Key
      description: |
        The response carries the enrollment string. It is returned only here
        and cannot be retrieved again: the server keeps only the public key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterKeyCreate"
      responses:
        "201":
          description: Register Key created
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterKeyCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /register-keys/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [enrollment]
      operationId: getRegisterKey
      summary: Get a Register Key
      description: Never returns secrets or the enrollment string.
      responses:
        "200":
          description: Register Key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /register-keys/{id}/revoke:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [enrollment]
      operationId: revokeRegisterKey
      summary: Revoke a Register Key
      description: Takes effect immediately. Agents already enrolled with the key are not affected. Returns `409` when already revoked.
      responses:
        "200":
          description: Register Key revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /releases:
    get:
      tags: [updates]
      operationId: listReleases
      summary: List releases known to the server
      parameters:
        - $ref: "#/components/parameters/QueryQ"
        - name: source
          in: query
          schema:
            $ref: "#/components/schemas/ReleaseSource"
        - name: verified
          in: query
          schema:
            type: boolean
        - name: sort
          in: query
          schema:
            type: string
            enum: [version, "-version", publishedAt, "-publishedAt", importedAt, "-importedAt"]
            default: "-version"
        - $ref: "#/components/parameters/QueryLimit"
        - $ref: "#/components/parameters/QueryOffset"
      responses:
        "200":
          description: Releases
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/UnexpectedError"
    post:
      tags: [updates]
      operationId: uploadRelease
      summary: Upload a release bundle
      description: |
        The bundle (`bomcensus-<version>.tar`) is verified (manifest signature
        and code signatures) before it is stored. The version is taken from the
        signed manifest. A bundle that fails verification is rejected with
        `400` and code `release_verification_failed`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ReleaseUpload"
      responses:
        "201":
          description: Release stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Release"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /update-settings:
    get:
      tags: [updates]
      operationId: getUpdateSettings
      summary: Deployed version and update check interval
      responses:
        "200":
          description: Update settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/UnexpectedError"
    put:
      tags: [updates]
      operationId: setUpdateSettings
      summary: Change the deployed version and update check interval
      description: "`targetVersion` must name a verified release. `null` stops distributing updates."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettings"
      responses:
        "200":
          description: Update settings changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /scan-targets:
    get:
      tags: [scans]
      operationId: listScanTargets
      summary: List agentless scan targets
      description: "`q` matches name and address."
      parameters:
        - $ref: "#/components/parameters/QueryQ"
        - name: scannerId
          in: query
          schema:
            type: string
        - name: credentialId
          in: query
          schema:
            type: string
        - name: lastResult
          in: query
          schema:
            $ref: "#/components/schemas/ScanResult"
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, "-name", address, "-address", lastRun, "-lastRun"]
            default: name
        - $ref: "#/components/parameters/QueryLimit"
        - $ref: "#/components/parameters/QueryOffset"
      responses:
        "200":
          description: Scan targets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanTargetList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/UnexpectedError"
    post:
      tags: [scans]
      operationId: createScanTarget
      summary: Add a scan target
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanTargetCreate"
      responses:
        "201":
          description: Scan target created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanTarget"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /scan-targets/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    patch:
      tags: [scans]
      operationId: updateScanTarget
      summary: Change a scan target
      description: |
        Absent fields are left unchanged; `scannerId: null` assigns the
        target to the embedded scanner. `resetHostKey: true` removes the
        pinned host key so that the next connection pins the key it sees.
        The address cannot be changed; add a new target for another host.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanTargetUpdate"
      responses:
        "200":
          description: Scan target updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanTarget"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"
    delete:
      tags: [scans]
      operationId: deleteScanTarget
      summary: Remove a scan target
      description: The asset it produced is kept.
      responses:
        "204":
          description: Scan target deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /scan-targets/{id}/run:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [scans]
      operationId: runScanTarget
      summary: Scan a target now
      responses:
        "202":
          description: Scan requested
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /credentials:
    get:
      tags: [scans]
      operationId: listCredentials
      summary: List credentials
      description: Secrets are write-only and never returned. `q` matches name and username.
      parameters:
        - $ref: "#/components/parameters/QueryQ"
        - name: kind
          in: query
          schema:
            $ref: "#/components/schemas/CredentialKind"
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, "-name", kind, "-kind", username, "-username", usedBy, "-usedBy", createdAt, "-createdAt"]
            default: name
        - $ref: "#/components/parameters/QueryLimit"
        - $ref: "#/components/parameters/QueryOffset"
      responses:
        "200":
          description: Credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/UnexpectedError"
    post:
      tags: [scans]
      operationId: createCredential
      summary: Store a credential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialCreate"
      responses:
        "201":
          description: Credential stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /credentials/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    delete:
      tags: [scans]
      operationId: deleteCredential
      summary: Delete a credential
      description: Returns `409` while a scan target or cluster uses it.
      responses:
        "204":
          description: Credential deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /credentials/{id}/secret:
    parameters:
      - $ref: "#/components/parameters/PathId"
    put:
      tags: [scans]
      operationId: rotateCredentialSecret
      summary: Replace the secret of a credential
      description: |
        The kind stays the same and takes the same fields as on creation;
        `username` is kept when absent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialSecretUpdate"
      responses:
        "200":
          description: Secret replaced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /settings/tls:
    get:
      tags: [settings]
      operationId: getTlsSettings
      summary: State of the Web/API and Agent TLS configurations
      responses:
        "200":
          description: TLS state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TlsState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /settings/tls/{endpoint}:
    parameters:
      - name: endpoint
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/TlsEndpointName"
    put:
      tags: [settings]
      operationId: updateTlsEndpoint
      summary: Switch a TLS configuration between automatic and manual, or replace the manual certificate
      description: |
        `mode=auto`: the server issues and renews the certificate from its
        internal CA; `certificateChain` and `privateKey` must be absent.
        `mode=manual`: `certificateChain` and `privateKey` are required.

        For `agent`, the supplied chain must contain a certificate whose SPKI
        hash is the current trust anchor (or the prepared one, see
        `POST /settings/tls/agent/anchor`); otherwise the request fails with
        `409` and code `anchor_mismatch`, because enrolled agents would stop
        trusting the server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TlsEndpointUpdate"
      responses:
        "200":
          description: TLS configuration changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TlsState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /settings/tls/agent/anchor:
    post:
      tags: [settings]
      operationId: changeAgentTlsAnchor
      summary: Two-step change of the Agent TLS trust anchor
      description: |
        `prepare` adds a new anchor to the trust bundle that agents
        synchronize. In automatic mode the server creates a new internal CA; in
        manual mode `certificate` (PEM) is the new anchor certificate.
        `activate` switches the Agent TLS certificate to the prepared anchor.
        While `pendingAnchor.unsyncedAgents` is not zero, `activate` fails with
        `409` and code `agents_not_synced` unless `force` is set; those agents
        lose their connection. `cancel` drops the prepared anchor.
        Enrollment strings created before activation contain the old anchor
        hash and stop working after it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentAnchorChange"
      responses:
        "200":
          description: TLS state after the step
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TlsState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /feed-instance:
    get:
      tags: [feed]
      operationId: getFeedInstance
      summary: The key that identifies this installation to feed servers
      description: The key is created on first use and cannot be changed.
      responses:
        "200":
          description: Instance key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedInstance"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /feed-servers:
    get:
      tags: [feed]
      operationId: listFeedServers
      summary: Feed servers, built-in first
      responses:
        "200":
          description: Feed servers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedServerList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/UnexpectedError"
    post:
      tags: [feed]
      operationId: createFeedServer
      summary: Register a feed server
      description: |
        The URL must use https (http is accepted for a loopback host). The
        server key is stored at the first contact. A new server is not
        active.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedServerCreate"
      responses:
        "201":
          description: Feed server created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedServer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /feed-servers/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    patch:
      tags: [feed]
      operationId: updateFeedServer
      summary: Change a feed server
      description: |
        Absent fields are left unchanged. `active: true` makes this the only
        active server; it must be enabled. The active server cannot be
        disabled (`409`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedServerUpdate"
      responses:
        "200":
          description: Feed server updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedServer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/UnexpectedError"
    delete:
      tags: [feed]
      operationId: deleteFeedServer
      summary: Remove a feed server
      description: The built-in and the active server cannot be removed (`409`).
      responses:
        "204":
          description: Feed server deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /feed-servers/{id}/test:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [feed]
      operationId: testFeedServer
      summary: Connect to a feed server and read its data status
      description: |
        Runs a handshake in a session of its own, reads the data status and
        ends the session. On the first contact the server key is stored. The
        outcome is in `status` and `lastError` of the returned server.
      responses:
        "200":
          description: Feed server after the test
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedServer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /feed-servers/{id}/trust-key:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [feed]
      operationId: trustFeedServerKey
      summary: Trust the key a feed server presented in place of the stored one
      description: |
        Applies in the `key_changed` state. `key` must equal `presentedKey`,
        otherwise `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedServerTrustKey"
      responses:
        "200":
          description: Feed server with the new key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedServer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /feed-servers/{id}/rematch:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [feed]
      operationId: rematchFeedServer
      summary: Match every component against this server again
      description: Applies to the active server (`409` otherwise). Matching runs in the background.
      responses:
        "202":
          description: Matching queued
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/UnexpectedError"

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: bomcensus_session

  parameters:
    QueryQ:
      name: q
      in: query
      description: Free-text search, case-insensitive substring match.
      schema:
        type: string
        maxLength: 256
    QueryLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 200
    QueryOffset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    PathId:
      name: id
      in: path
      required: true
      schema:
        type: string
    PathDigest:
      name: digest
      in: path
      required: true
      description: Image digest, for example `sha256:0123…`.
      schema:
        type: string
        pattern: "^sha256:[0-9a-f]{64}$"

  responses:
    BadRequest:
      description: The request is malformed or a value is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: No valid session, or wrong credentials on login.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The request conflicts with the current state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: The request body is too large.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Too many attempts. Retry later.
      headers:
        Retry-After:
          description: Seconds to wait.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnexpectedError:
      description: Unexpected error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable snake_case error identifier.
        message:
          type: string

    # ── meta / auth / dashboard ─────────────────────────────────────────

    Meta:
      type: object
      required: [version, features]
      properties:
        version:
          type: string
        features:
          $ref: "#/components/schemas/Features"
        agentAddress:
          description: "`host:port` agents and scanners connect to (the first Agent TLS server name with the agent port). Absent when not configured."
          type: string
    Features:
      type: object
      required: [vulnerabilities, sbomExport]
      properties:
        vulnerabilities:
          type: boolean
        sbomExport:
          type: boolean

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 256
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 1024
    Principal:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string

    Dashboard:
      type: object
      required: [assets, coverage, processes, agents]
      properties:
        assets:
          $ref: "#/components/schemas/DashboardAssets"
        coverage:
          description: Number of assets per coverage value. Every value is present.
          type: array
          items:
            $ref: "#/components/schemas/CoverageCount"
        processes:
          $ref: "#/components/schemas/DashboardProcesses"
        agents:
          $ref: "#/components/schemas/DashboardAgents"
    DashboardAssets:
      type: object
      required: [total, hosts, workloads, limited]
      properties:
        total:
          type: integer
        hosts:
          type: integer
        workloads:
          type: integer
        limited:
          description: Assets whose coverage is not `full`.
          type: integer
    CoverageCount:
      type: object
      required: [coverage, count]
      properties:
        coverage:
          $ref: "#/components/schemas/Coverage"
        count:
          type: integer
    DashboardProcesses:
      type: object
      required: [restartRequired, suspicious]
      properties:
        restartRequired:
          type: integer
        suspicious:
          type: integer
    DashboardAgents:
      description: Counts over agents and scanners.
      type: object
      required: [online, offline, pendingApproval, revoked, notPinned, tlsIntercepted]
      properties:
        online:
          type: integer
        offline:
          type: integer
        pendingApproval:
          type: integer
        revoked:
          type: integer
        notPinned:
          description: Non-revoked agents whose TLS mode is not `pinned`.
          type: integer
        tlsIntercepted:
          description: Non-revoked agents that observed a server certificate other than the server's own.
          type: integer

    # ── assets ──────────────────────────────────────────────────────────

    AssetKind:
      type: string
      enum: [host, workload]
    CollectMethod:
      type: string
      enum: [agent, ssh, k8s_exec, k8s_inventory]
    Coverage:
      description: |
        `full`: everything collected. `partial`: some items could not be read.
        `process_only`: only the processes section (replicas of a workload).
        `inventory_only`: only image reference and digest. `unsupported`: the
        target cannot be collected (for example an image without a shell).
        `failed`: the last collection failed.
      type: string
      enum: [full, partial, process_only, inventory_only, unsupported, failed]
    PrivilegeLevel:
      type: string
      enum: [privileged, non_root]
    SectionName:
      type: string
      enum: [host, packages, artifacts, processes, containers]
    SectionCoverageLevel:
      type: string
      enum: [full, partial, none]
    SectionCoverage:
      type: object
      required: [section, coverage]
      properties:
        section:
          $ref: "#/components/schemas/SectionName"
        coverage:
          $ref: "#/components/schemas/SectionCoverageLevel"
        reason:
          type: string
        collectedAt:
          type: string
          format: date-time
    AssetOs:
      type: object
      required: [family, name, version, arch]
      properties:
        family:
          description: "`linux` or `windows`."
          type: string
        name:
          type: string
        version:
          type: string
        kernel:
          type: string
        arch:
          type: string
    ContainerRuntime:
      type: string
      enum: [kubernetes, docker, containerd]
    AssetContainer:
      description: |
        A container of an asset. For a workload it is a container of the pod
        template, for a host a container running on it. The name identifies
        the container within the asset and survives image changes.
      type: object
      required: [name, imageRef, runtime, instances, coverage]
      properties:
        name:
          type: string
        imageRef:
          type: string
        imageDigest:
          description: Absent while the runtime has not reported a digest.
          type: string
        runtime:
          $ref: "#/components/schemas/ContainerRuntime"
        instances:
          description: Running instances. Pods for a workload; 1 (running) or 0 (stopped) on a host.
          type: integer
        coverage:
          $ref: "#/components/schemas/Coverage"
        coverageReason:
          type: string
        startedAt:
          type: string
          format: date-time
    AssetSummary:
      type: object
      required: [id, name, kind, group, tags, method, coverage, containerCount, firstSeen, lastSeen]
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          $ref: "#/components/schemas/AssetKind"
        group:
          description: Empty when the asset is in no group.
          type: string
        tags:
          type: array
          items:
            type: string
        os:
          $ref: "#/components/schemas/AssetOs"
        address:
          type: string
        method:
          $ref: "#/components/schemas/CollectMethod"
        coverage:
          $ref: "#/components/schemas/Coverage"
        coverageReason:
          type: string
        privilege:
          $ref: "#/components/schemas/PrivilegeLevel"
        agentId:
          type: string
        scanTargetId:
          type: string
        clusterId:
          type: string
        clusterName:
          type: string
        namespace:
          type: string
        workloadKind:
          type: string
        containerCount:
          type: integer
        images:
          description: Distinct image references of the current containers.
          type: array
          items:
            type: string
        collectRequestedAt:
          description: Time of a requested collection that no report has answered yet.
          type: string
          format: date-time
        firstSeen:
          type: string
          format: date-time
        lastSeen:
          type: string
          format: date-time
    Asset:
      type: object
      required: [id, name, kind, group, tags, method, coverage, sections, containers, firstSeen, lastSeen]
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          $ref: "#/components/schemas/AssetKind"
        group:
          description: Empty when the asset is in no group.
          type: string
        tags:
          type: array
          items:
            type: string
        os:
          $ref: "#/components/schemas/AssetOs"
        address:
          type: string
        method:
          $ref: "#/components/schemas/CollectMethod"
        coverage:
          $ref: "#/components/schemas/Coverage"
        coverageReason:
          type: string
        privilege:
          $ref: "#/components/schemas/PrivilegeLevel"
        sections:
          description: Coverage of each section in the latest collection.
          type: array
          items:
            $ref: "#/components/schemas/SectionCoverage"
        agentId:
          type: string
        scanTargetId:
          type: string
        clusterId:
          description: Workloads only.
          type: string
        clusterName:
          description: Workloads only.
          type: string
        namespace:
          description: Workloads only.
          type: string
        workloadKind:
          description: Workloads only. Kind of the top-level controller (`Deployment`, `StatefulSet`, `DaemonSet`, `CronJob`, `Job`, `Pod`, …).
          type: string
        workloadId:
          description: Workloads only.
          type: string
        replicas:
          description: Workloads only. Desired replicas (or current pods for kinds without a replica count).
          type: integer
        containers:
          type: array
          items:
            $ref: "#/components/schemas/AssetContainer"
        collectRequestedAt:
          description: Time of a requested collection that no report has answered yet.
          type: string
          format: date-time
        firstSeen:
          type: string
          format: date-time
        lastSeen:
          type: string
          format: date-time
    CollectRequest:
      type: object
      required: [requestedAt]
      properties:
        requestedAt:
          description: Time of the request; shown as `collectRequestedAt` on the asset until a newer report arrives.
          type: string
          format: date-time
    AssetList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AssetSummary"
        total:
          type: integer
    AssetGroup:
      type: object
      required: [name, assetCount]
      properties:
        name:
          type: string
        assetCount:
          type: integer
    AssetGroupList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AssetGroup"
        total:
          type: integer

    # ── components ──────────────────────────────────────────────────────

    ComponentType:
      type: string
      enum: [deb, rpm, apk, maven, golang, binary, middleware]
    ComponentOrigin:
      description: "`distro`: distribution package. `third_party`: package from a third-party repository. `upstream`: software that is not a package."
      type: string
      enum: [distro, third_party, upstream]
    DetectMethod:
      type: string
      enum: [package_db, exec, static, manifest, buildinfo]
    ComponentLayer:
      description: "`image`: part of the container image (shared by digest). `runtime`: added or changed while the container runs."
      type: string
      enum: [image, runtime]
    SoftwareComponent:
      type: object
      required: [id, type, name, version, purl, origin]
      properties:
        id:
          type: string
        type:
          $ref: "#/components/schemas/ComponentType"
        name:
          type: string
        version:
          type: string
        purl:
          type: string
        cpe:
          type: string
        sourceName:
          type: string
        sourceVersion:
          type: string
        distro:
          type: string
        arch:
          type: string
        vendor:
          type: string
        origin:
          $ref: "#/components/schemas/ComponentOrigin"
    ComponentSummary:
      type: object
      required: [id, type, name, version, purl, origin, assetCount, runningAssetCount]
      properties:
        id:
          type: string
        type:
          $ref: "#/components/schemas/ComponentType"
        name:
          type: string
        version:
          type: string
        purl:
          type: string
        cpe:
          type: string
        sourceName:
          type: string
        sourceVersion:
          type: string
        distro:
          type: string
        arch:
          type: string
        vendor:
          type: string
        origin:
          $ref: "#/components/schemas/ComponentOrigin"
        assetCount:
          description: Assets on which the component is currently installed.
          type: integer
        runningAssetCount:
          description: |
            Assets on which a running process executes or maps the component,
            as of the asset's latest report.
          type: integer
    ComponentList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ComponentSummary"
        total:
          type: integer
    AssetComponentRow:
      description: One installation of a component on an asset (and container).
      type: object
      required: [assetId, componentId, locations, inUse, method, firstSeen, component]
      properties:
        assetId:
          type: string
        componentId:
          type: string
        container:
          description: Name of the container the component was found in. Absent for the host itself.
          type: string
        layer:
          $ref: "#/components/schemas/ComponentLayer"
        locations:
          description: File paths (for nested archives `outer.jar!/inner.jar`).
          type: array
          items:
            type: string
        inUse:
          description: A running process executes or has opened one of the files.
          type: boolean
        method:
          $ref: "#/components/schemas/DetectMethod"
        versionCommand:
          description: The version command that was run (`method=exec`), shell-quoted.
          type: string
        versionRaw:
          description: Raw output of the version command (stdout, then stderr), truncated to 64 KiB per stream.
          type: string
        versionExitCode:
          type: integer
        versionTruncated:
          type: boolean
        firstSeen:
          type: string
          format: date-time
        removedAt:
          type: string
          format: date-time
        component:
          $ref: "#/components/schemas/SoftwareComponent"
    AssetComponentList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AssetComponentRow"
        total:
          type: integer
    ComponentAssetRow:
      type: object
      required: [assetId, componentId, locations, inUse, method, firstSeen, asset]
      properties:
        assetId:
          type: string
        componentId:
          type: string
        container:
          type: string
        layer:
          $ref: "#/components/schemas/ComponentLayer"
        locations:
          type: array
          items:
            type: string
        inUse:
          type: boolean
        method:
          $ref: "#/components/schemas/DetectMethod"
        versionCommand:
          type: string
        versionRaw:
          type: string
        versionExitCode:
          type: integer
        versionTruncated:
          type: boolean
        firstSeen:
          type: string
          format: date-time
        removedAt:
          type: string
          format: date-time
        asset:
          $ref: "#/components/schemas/AssetSummary"
    ComponentAssetList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ComponentAssetRow"
        total:
          type: integer

    # ── processes ───────────────────────────────────────────────────────

    ExeState:
      description: "`replaced`: another file now exists at the path. `deleted`: nothing exists at the path. `memfd`: executed from an anonymous memory file."
      type: string
      enum: [normal, replaced, deleted, memfd]
    ExeSource:
      description: "`cmdline`: no privilege to read the executable; the path is guessed from argv[0]."
      type: string
      enum: [proc, cmdline]
    ListenProto:
      type: string
      enum: [tcp, udp]
    ListenPort:
      type: object
      required: [proto, address, port]
      properties:
        proto:
          $ref: "#/components/schemas/ListenProto"
        address:
          type: string
        port:
          type: integer
    MappedLib:
      type: object
      required: [path, state]
      properties:
        path:
          type: string
        state:
          type: string
          enum: [replaced, deleted]
        sha256:
          type: string
    ProcessInfo:
      type: object
      required: [id, assetId, assetName, pid, user, exePath, exeSource, cmdline, startedAt, exeState, deletedLibs, listen]
      properties:
        id:
          type: string
        assetId:
          type: string
        assetName:
          type: string
        pid:
          type: integer
        ppid:
          type: integer
        user:
          type: string
        uid:
          type: integer
        exePath:
          type: string
        exeSource:
          $ref: "#/components/schemas/ExeSource"
        sha256:
          type: string
        cmdline:
          description: Secrets masked. Empty when command line collection is off.
          type: string
        startedAt:
          type: string
          format: date-time
        exeState:
          $ref: "#/components/schemas/ExeState"
        deletedLibs:
          description: Executable mappings whose file was replaced or deleted.
          type: array
          items:
            $ref: "#/components/schemas/MappedLib"
        listen:
          type: array
          items:
            $ref: "#/components/schemas/ListenPort"
        container:
          description: Name of the container the process runs in.
          type: string
        componentId:
          description: Component that owns the executable, when known.
          type: string
    ProcessList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProcessInfo"
        total:
          type: integer
    ListenPortRow:
      type: object
      required: [proto, address, port, assetId, assetName]
      properties:
        proto:
          $ref: "#/components/schemas/ListenProto"
        address:
          type: string
        port:
          type: integer
        assetId:
          type: string
        assetName:
          type: string
        container:
          type: string
        processId:
