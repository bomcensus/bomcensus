        container:
          $ref: "#/components/schemas/AssetContainer"
    ImageComponent:
      type: object
      required: [component, locations, method]
      properties:
        component:
          $ref: "#/components/schemas/SoftwareComponent"
        locations:
          type: array
          items:
            type: string
        method:
          $ref: "#/components/schemas/DetectMethod"
    ContainerImageDetail:
      type: object
      required: [digest, currentTags, previousTags, firstSeen, usage, contentKnown, componentCount, uses, components]
      properties:
        digest:
          type: string
        currentTags:
