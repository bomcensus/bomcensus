          type: string
        componentName:
          type: string
    ListenPortList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ListenPortRow"
        total:
          type: integer

    # ── images ──────────────────────────────────────────────────────────

    ImageUsage:
      type: object
      required: [assets, containers, instances]
      properties:
        assets:
          type: integer
        containers:
          type: integer
        instances:
          type: integer
    CurrentImageTags:
      description: |
        Tags that point to the digest now: a host or cluster that is not gone
        lists the tag for this digest in its latest observation. Sorted.
      type: array
      items:
        type: string
    PreviousImageTag:
      type: object
      required: [tag, lastSeen]
      properties:
        tag:
          type: string
        lastSeen:
          description: When a host or cluster last listed the tag for this digest.
          type: string
