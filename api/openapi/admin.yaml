        components:
          description: Components in the `image` layer. Components added at runtime are not included.
          type: array
          items:
            $ref: "#/components/schemas/ImageComponent"

    # ── kubernetes ──────────────────────────────────────────────────────

    K8sConnection:
      description: "`kubeconfig`: the scanner uses a stored kubeconfig credential. `in_cluster`: a scanner deployed inside the cluster uses its ServiceAccount."
      type: string
      enum: [in_cluster, kubeconfig]
    K8sFilter:
      description: |
        Glob patterns for namespaces; `key=value` (or `key` for presence)
        selectors for labels and annotations. Evaluation order: namespace
        include, namespace exclude, label/annotation include, label/annotation
        exclude. Exclude always wins. Empty include lists match everything.
      type: object
      required: [nsInclude, nsExclude, labelInclude, labelExclude, annotationInclude, annotationExclude]
      properties:
        nsInclude:
          type: array
          items:
            type: string
        nsExclude:
          type: array
          items:
            type: string
        labelInclude:
          type: array
          items:
            type: string
        labelExclude:
          type: array
          items:
            type: string
        annotationInclude:
          type: array
          items:
            type: string
        annotationExclude:
          type: array
          items:
            type: string
    K8sSyncStatus:
      type: string
      enum: [never, ok, failed]
    K8sCluster:
      type: object
      required: [id, name, connection, execEnabled, filter, syncStatus, workloadCount, excludedCount, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        version:
          description: Kubernetes server version from the last sync.
          type: string
        scannerId:
          description: Scanner that talks to the cluster. Absent means the server's embedded scanner.
          type: string
        connection:
          $ref: "#/components/schemas/K8sConnection"
        credentialId:
          description: Kubeconfig credential (`connection=kubeconfig`).
          type: string
        execEnabled:
          description: Collect pod contents through `pods/exec`. Off means image inventory only.
          type: boolean
        filter:
          $ref: "#/components/schemas/K8sFilter"
        syncStatus:
          $ref: "#/components/schemas/K8sSyncStatus"
        syncMessage:
          description: Error of the last failed sync.
          type: string
        lastSync:
          type: string
          format: date-time
        workloadCount:
          type: integer
        excludedCount:
          description: Workloads excluded by the filter.
          type: integer
        createdAt:
          type: string
          format: date-time
    K8sClusterCreate:
      description: |
        `connection=kubeconfig` requires `credentialId` (a `kubeconfig`
        credential); `scannerId` defaults to the embedded scanner.
        `connection=in_cluster` requires `scannerId` (the scanner deployed in
        the cluster) and no `credentialId`.
      type: object
      required: [name, connection]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        connection:
          $ref: "#/components/schemas/K8sConnection"
        credentialId:
          type: string
        scannerId:
          type: string
        execEnabled:
          type: boolean
          default: false
        filter:
          $ref: "#/components/schemas/K8sFilter"
    K8sClusterUpdate:
      description: "Absent fields are left unchanged; `null` clears `credentialId` or `scannerId`."
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        connection:
          $ref: "#/components/schemas/K8sConnection"
        credentialId:
          description: "`null` (or an empty string) removes the credential, for example when switching to `in_cluster`."
          type: string
          nullable: true
          x-go-type: nullable.Nullable[string]
          x-go-type-skip-optional-pointer: true
          x-go-type-import:
            path: github.com/oapi-codegen/nullable
        scannerId:
          description: "`null` (or an empty string) assigns the cluster to the embedded scanner."
          type: string
          nullable: true
          x-go-type: nullable.Nullable[string]
          x-go-type-skip-optional-pointer: true
          x-go-type-import:
            path: github.com/oapi-codegen/nullable
        execEnabled:
          type: boolean
        filter:
          $ref: "#/components/schemas/K8sFilter"
    K8sClusterList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/K8sCluster"
        total:
          type: integer
    K8sWorkload:
      description: A top-level controller (a Deployment, not its ReplicaSet). A pod without an owner is its own workload of kind `Pod`.
      type: object
      required: [id, clusterId, namespace, kind, name, replicas, excluded, coverages]
      properties:
        id:
          type: string
        clusterId:
          type: string
        namespace:
          type: string
        kind:
          description: "`Deployment`, `StatefulSet`, `DaemonSet`, `CronJob`, `Job`, `Pod`, or the kind of another owning controller."
          type: string
        name:
          type: string
        replicas:
          type: integer
        assetId:
          description: Absent for excluded workloads, which do not become assets.
          type: string
        excluded:
          type: boolean
        excludedBy:
          description: The filter rule that excluded the workload.
          type: string
        coverages:
          description: Distinct coverage values of the workload's pod containers.
          type: array
          items:
            $ref: "#/components/schemas/Coverage"
    K8sWorkloadList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/K8sWorkload"
        total:
          type: integer
    K8sPodPhase:
      type: string
      enum: [Running, Pending, Succeeded, Failed, Unknown]
    K8sPodContainer:
      type: object
      required: [name, imageRef, coverage]
      properties:
        name:
          type: string
        imageRef:
          type: string
        imageDigest:
          type: string
        coverage:
          $ref: "#/components/schemas/Coverage"
        coverageReason:
          type: string
    K8sPod:
      type: object
      required: [id, workloadId, namespace, name, node, phase, containers]
      properties:
        id:
          type: string
        workloadId:
          type: string
        namespace:
          type: string
        name:
          type: string
        node:
          type: string
        phase:
          $ref: "#/components/schemas/K8sPodPhase"
        startedAt:
          type: string
          format: date-time
        containers:
          type: array
          items:
            $ref: "#/components/schemas/K8sPodContainer"
    K8sPodList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/K8sPod"
        total:
          type: integer

    # ── agents ──────────────────────────────────────────────────────────

    AgentKind:
      type: string
      enum: [agent, scanner]
    AgentStatus:
      type: string
      enum: [online, offline, pending_approval, revoked]
    ConnMode:
      type: string
      enum: [connect, listen]
    TlsMode:
      description: Server certificate verification mode of the agent.
