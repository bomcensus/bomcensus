        os:
          type: string
        arch:
          type: string
        sizeBytes:
          type: integer
          format: int64
        firstSeen:
          type: string
          format: date-time
        lastSeen:
          type: string
          format: date-time
        usage:
          $ref: "#/components/schemas/ImageUsage"
        contentKnown:
          description: The content of the image (its `image` layer) has been collected from at least one container.
          type: boolean
        componentCount:
          description: Components in the `image` layer.
          type: integer
    ContainerImageList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ContainerImage"
        total:
          type: integer
    ImageUse:
      type: object
      required: [asset, container]
      properties:
        asset:
