# oapi-codegen configuration for agent.yaml. Run `make generate`.
package: agentapi
output: internal/gen/agentapi/agentapi.gen.go
generate:
  models: true
  chi-server: true
  strict-server: true
  client: true
output-options:
  # Keep schemas and header components that no operation references
  # (sealed secret plaintext, signature headers).
  skip-prune: true
