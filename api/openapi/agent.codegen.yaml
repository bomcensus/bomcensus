# oapi-codegen configuration for agent.yaml: the DTOs of the agent protocol
# (package agentproto/dto). The HTTP server and client are generated by
# agent-http.codegen.yaml. Run `make generate`.
package: dto
output: agentproto/dto/dto.gen.go
generate:
  models: true
output-options:
  # Keep schemas and header components that no operation references
  # (sealed secret plaintext, signature headers).
  skip-prune: true
