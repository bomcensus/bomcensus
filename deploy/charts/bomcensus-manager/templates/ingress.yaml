{{- if .Values.ingress.enabled }}
{{- $svc := include "bomcensus-manager.webService" . }}
{{- $port := .Values.web.service.port }}
# Console and administrative API only; see services.yaml for why the agent
# port has no Ingress.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "bomcensus-manager.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bomcensus-manager.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ default "Prefix" .pathType }}
            backend:
              service:
                name: {{ $svc }}
                port:
                  number: {{ $port }}
          {{- end }}
    {{- end }}
{{- end }}
