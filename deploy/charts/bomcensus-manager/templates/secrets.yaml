{{- $fullname := include "bomcensus-manager.fullname" . }}
{{- $mode := include "bomcensus-manager.databaseMode" . }}
{{- if not .Values.masterKey.existingSecret.name }}
{{- $name := include "bomcensus-manager.masterKeySecret" . }}
{{- $key := .Values.masterKey.value }}
{{- if not $key }}
{{- /* Keep the key of an earlier install; generate one only the first time. */}}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $old $old.data (index $old.data "master-key") }}
{{- $key = index $old.data "master-key" | b64dec }}
{{- else }}
{{- $key = randBytes 32 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bomcensus-manager.labels" . | nindent 4 }}
  annotations:
    # Losing this key loses the CA keys and all stored credentials.
    helm.sh/resource-policy: keep
type: Opaque
data:
  master-key: {{ $key | trim | b64enc | quote }}
---
{{- end }}
{{- if and .Values.admin.user (not .Values.admin.existingSecret.name) }}
{{- if not .Values.admin.passwordHash }}
{{- fail "admin.passwordHash is required (an argon2id hash from: bomcensus-server hash-password), or set admin.existingSecret.name" }}
{{- end }}
{{- if not (hasPrefix "$argon2id$" .Values.admin.passwordHash) }}
{{- fail "admin.passwordHash must be an argon2id PHC string ($argon2id$…), not a password; create one with: bomcensus-server hash-password" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bomcensus-manager.adminSecret" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bomcensus-manager.labels" . | nindent 4 }}
type: Opaque
data:
  password-hash: {{ .Values.admin.passwordHash | trim | b64enc | quote }}
---
{{- end }}
{{- if eq $mode "url" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-database
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bomcensus-manager.labels" . | nindent 4 }}
type: Opaque
data:
  url: {{ .Values.database.url | trim | b64enc | quote }}
{{- end }}
