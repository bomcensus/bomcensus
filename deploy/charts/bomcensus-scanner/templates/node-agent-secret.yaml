{{- if and .Values.nodeAgent.enabled .Values.nodeAgent.enrollment.token }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bomcensus-scanner.nodeAgentTokenSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bomcensus-scanner.nodeAgentLabels" . | nindent 4 }}
type: Opaque
data:
  token: {{ .Values.nodeAgent.enrollment.token | trim | b64enc | quote }}
{{- end }}
