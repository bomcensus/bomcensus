# bomcensus with Docker Compose. See docs/DEPLOYMENT.md.
#
#   ./init.sh                                  create .env (once)
#   docker compose up -d                       postgres + server
#   docker compose --profile demo up -d        also the demo agent and SSH target
#
# Images are built by `make docker-build`; `docker compose build` builds the
# server and agent from the same Dockerfile.

name: bomcensus

x-build: &build
  context: ../..
  dockerfile: deploy/docker/Dockerfile
  args:
    VERSION: ${BOMCENSUS_VERSION:-0.0.0-dev}

services:
  postgres:
    image: postgres:17-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: bomcensus
      POSTGRES_DB: bomcensus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run init.sh first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "bomcensus", "-d", "bomcensus"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  server:
    image: ${BOMCENSUS_REPO:-bomcensus}/server:${BOMCENSUS_VERSION:-0.0.0-dev}
    build:
      <<: *build
      target: server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BOMCENSUS_DATABASE_URL: postgres://bomcensus:${POSTGRES_PASSWORD:?run init.sh first}@postgres:5432/bomcensus?sslmode=disable
      BOMCENSUS_MASTER_KEY: ${BOMCENSUS_MASTER_KEY:?run init.sh first}
      BOMCENSUS_ADMIN_USER: ${ADMIN_USER:-admin}
      BOMCENSUS_ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?run init.sh first}
      BOMCENSUS_WEB_TLS: ${WEB_TLS:-auto}
      BOMCENSUS_WEB_SERVER_NAMES: ${WEB_SERVER_NAMES:-localhost}
      BOMCENSUS_AGENT_SERVER_NAMES: ${AGENT_SERVER_NAMES:-localhost,server}
      BOMCENSUS_LOG_LEVEL: ${BOMCENSUS_LOG_LEVEL:-info}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-8080}:8080"
      - "${BIND_ADDRESS:-0.0.0.0}:${AGENT_PORT:-8443}:8443"
    healthcheck:
      # Requests /readyz on the loopback address, over HTTP or HTTPS
      # according to BOMCENSUS_WEB_TLS.
      test: ["CMD", "/usr/local/bin/bomcensus-server", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ---- demo profile: for trying the product only ---------------------------

  # Agent in a container. It inventories its own container file system.
  agent:
    profiles: [demo]
    image: ${BOMCENSUS_REPO:-bomcensus}/agent:${BOMCENSUS_VERSION:-0.0.0-dev}
    build:
      <<: *build
      target: agent
    restart: unless-stopped
    init: true
    hostname: demo-agent
    depends_on:
      server:
        condition: service_healthy
    environment:
      BOMCENSUS_SERVER: https://server:8443
      BOMCENSUS_TOKEN: ${BOMCENSUS_TOKEN:-}
      BOMCENSUS_LOG_LEVEL: ${BOMCENSUS_LOG_LEVEL:-info}
    volumes:
      # A named volume takes the owner and mode of the image directory, so the
      # agent can keep it at 0700. Use a subdirectory when binding a host path.
      - agent-state:/var/lib/bomcensus/agent

  # SSH target for agentless collection. DEMO ONLY: fixed account
  # demo/demo with password login, reachable only on the compose network as
  # ssh-target:22.
  ssh-target:
    profiles: [demo]
    image: bomcensus/demo-ssh-target:local
    build:
      context: .
      dockerfile_inline: |
        FROM debian:trixie-slim
        RUN set -eu; \
            apt-get update; \
            apt-get install -y --no-install-recommends openssh-server; \
            rm -rf /var/lib/apt/lists/*; \
            useradd --create-home --shell /bin/bash demo; \
            echo 'demo:demo' | chpasswd; \
            mkdir -p /run/sshd; \
            printf 'PasswordAuthentication yes\nPermitRootLogin no\n' > /etc/ssh/sshd_config.d/demo.conf
        EXPOSE 22
        CMD ["/usr/sbin/sshd", "-D", "-e"]
    restart: unless-stopped
    hostname: ssh-target

volumes:
  postgres-data:
  agent-state:
